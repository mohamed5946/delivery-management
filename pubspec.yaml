name: deliverymanagement
description: Delivery Management - manager-only companion app for DeliveryFlow. Reads and writes the same Firebase project and Firestore data as DeliveryFlow; managers only.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.6.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  crypto: ^3.0.0
  shimmer: ^4.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
